# mcpize.yaml — MCPize deployment configuration
# Docs: https://mcpize.com/developers/publish-mcp-server
version: 1
name: expense-tracker
description: |
  Personal expense tracker MCP server. Record expenses, set monthly budgets,
  and generate spending summaries and reports. Each subscriber's data is
  isolated automatically.

# Runtime: typescript | python | php | container
runtime: typescript
entry: src/index.ts

# Build configuration
build:
  install: npm ci
  command: npm run build

# Start command — hosted over HTTP (Streamable HTTP transport).
# MCPize/Cloud Run inject PORT, which the server auto-detects to run in HTTP mode.
startCommand:
  type: http
  command: node dist/index.js

# --- Optional: per-subscriber credentials -----------------------------------
# This server isolates data per subscriber automatically from the request's
# auth header, so no credential is strictly required. If you want subscribers
# to supply an explicit identity/API token, uncomment below:
#
# credentials:
#   - name: EXPENSE_USER_TOKEN
#     required: false
#     description: Optional token that scopes your expense data.
#     mapping:
#       env: EXPENSE_USER_TOKEN
#     credentials_mode: per_user
#
# --- Publisher secrets (your own infra keys) ---------------------------------
# Without TURSO_DATABASE_URL, the server falls back to an in-memory store that
# is wiped every time MCPize recycles the instance ("scale to zero" on the
# free/hobby tier, or load-balancing across concurrent instances on any tier).
# Set this to get durable storage that survives restarts. See README's
# "Storage & persistence" section for how to create a free Turso database.
secrets:
  - name: TURSO_DATABASE_URL
    required: false
    description: |
      libSQL/Turso connection URL, e.g. libsql://<db>-<org>.turso.io. On plans
      limited to 1 secret, embed the auth token as a query param instead of
      using a second secret: libsql://<db>-<org>.turso.io?authToken=<token>
  # - name: TURSO_AUTH_TOKEN
  #   required: false
  #   description: Only needed if not embedding the token in TURSO_DATABASE_URL.

# Note: pricing tiers are configured in the MCPize Dashboard, not in this file.
